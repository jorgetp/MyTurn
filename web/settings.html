<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyTurn Ajustes</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MyTurn">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="bootstrap.min.css">
<link rel="stylesheet" href="bootstrap-theme.css">
<link rel="stylesheet" href="bootstrap-icons/bootstrap-icons.min.css">
<script src="theme.js"></script>
</head>
<body class="min-vh-100 bg-body-tertiary text-body">
<main class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-8 col-lg-6">
      <header class="d-flex align-items-center justify-content-between mb-4">
        <h1 class="h4 m-0 p-0">Ajustes</h1>
        <a class="btn btn-outline-secondary d-inline-flex align-items-center gap-2" href="/">
          <i class="bi bi-arrow-left" aria-hidden="true"></i>
          Volver
        </a>
      </header>

      <form id="config-form">
        <section class="card mb-3">
          <div class="card-body p-4">
            <h2 class="h6 mb-3 text-uppercase fw-semibold text-secondary">General</h2>
            <div class="mb-3">
              <label for="group-name-input" class="form-label">Nombre del grupo</label>
              <input type="text" id="group-name-input" class="form-control" required>
            </div>
            <div class="mb-3">
              <label for="timezone-input" class="form-label">Zona horaria (nombre IANA)</label>
              <input type="text" id="timezone-input" class="form-control" placeholder="Europe/Madrid" required>
            </div>
            <div class="mb-3">
              <label for="start-date-input" class="form-label">Fecha de inicio</label>
              <input type="date" id="start-date-input" class="form-control" required>
            </div>
          </div>
        </section>

        <section class="card mb-3">
          <div class="card-body p-4">
            <h2 class="h6 mb-3 text-uppercase fw-semibold text-secondary">Miembros</h2>
            <div id="members-container"></div>
            <button type="button" class="btn btn-outline-secondary d-inline-flex align-items-center gap-2 mt-2" id="add-member-btn">
              <i class="bi bi-plus-lg" aria-hidden="true"></i>
              Añadir
            </button>
          </div>
        </section>

        <section class="card mb-3">
          <div class="card-body p-4">
            <h2 class="h6 mb-3 text-uppercase fw-semibold text-secondary">Turno de hoy</h2>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" role="switch" id="skip-today-input">
              <label class="form-check-label" for="skip-today-input">Saltar, con lo cual la persona de hoy pasa a mañana y los siguientes turnos se desplazan un día</label>
            </div>
          </div>
        </section>

        <div id="config-status" class="mb-2" aria-live="polite"></div>
        <button type="submit" class="btn btn-primary w-100">Guardar cambios</button>
      </form>
    </div>
  </div>
</main>

<script src="settings.js"></script>
</body>
</html>
